<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Resume Skill Extractor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page-shell auth-page">
        <header class="topbar auth-topbar">
            <a class="brand" href="/">
                <span class="brand-mark">R</span>
                <span>RESUME SKILL ENTITY EXTRACTOR</span>
            </a>
        </header>

        <section class="auth-wrapper">
            <div class="auth-card">
                <p class="eyebrow">Create account</p>
                <h1>Register for access</h1>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="messages auth-messages">
                            {% for message in messages %}
                                <p>{{ message }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <form method="post" action="{{ url_for('register') }}" class="auth-form">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Choose a username" required>

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Minimum 6 characters" required>

                    <label for="confirm_password">Confirm password</label>
                    <input id="confirm_password" name="confirm_password" type="password" placeholder="Re-enter your password" required>

                    <button type="submit">Create account</button>
                </form>

                <p class="auth-switch">
                    Already have an account?
                    <a href="{{ url_for('login') }}">Log in</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
